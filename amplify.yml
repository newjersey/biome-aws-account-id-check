version: 1
applications:
  - appRoot: packages/nextjs-template
    frontend:
      buildPath: /
      phases:
        preBuild:
          commands:
            - npm install --global pnpm@11.21.0
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter @newjersey/nextjs-template build
      artifacts:
        baseDirectory: packages/nextjs-template/.next
        files:
          - "**/*"
      cache:
        paths:
          - "node_modules/**/*"
          - "packages/nextjs-template/node_modules/**/*"
          - "packages/nextjs-template/.next/cache/**/*"
